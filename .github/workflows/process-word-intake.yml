name: Enrich and publish vocabulary

on:
  push:
    paths:
      - "word-intake/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vocabulary-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out vocabulary records
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enrich pending vocabulary
        id: enrich
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_VOCAB_MODEL || 'gpt-5.6-luna' }}
        run: node automation/process-word-intake.mjs

      - name: Publish processed records
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No new vocabulary records to publish."
            exit 0
          fi
          git config user.name "english-day-day-up-bot"
          git config user.email "english-day-day-up-bot@users.noreply.github.com"
          git add word-intake processed-words processing-errors
          git commit -m "Automatically enrich vocabulary intake"
          git push

      - name: Report enrichment failure
        if: steps.enrich.outcome == 'failure'
        run: |
          echo "One or more vocabulary records could not be enriched. Check processing-errors/."
          exit 1
